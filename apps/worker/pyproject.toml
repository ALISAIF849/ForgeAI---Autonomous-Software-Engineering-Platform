[project]
name = "forgeai-worker"
version = "0.1.0"
description = "ForgeAI background worker — polls the Workflow Queue (services/workflow_engine) and drives WorkflowExecutor.advance() so executions progress without a human manually calling the API. A plain asyncio loop against the existing Postgres-backed queue, not Arq/Redis: the queue this drives is already a real, tested, DB-backed priority queue (sub-sprint 2.3) — introducing a second, Redis-backed queueing system to schedule polls of the first would be solving a problem this package doesn't have. Arq may still earn its place later for something that actually needs Redis-backed job semantics (e.g. real capability execution jobs), just not this."
requires-python = ">=3.12"
dependencies = [
    "forgeai-core",
    "forgeai-workflow-engine",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
]

[project.scripts]
forgeai-worker = "forgeai_worker.main:main"

[tool.uv.sources]
forgeai-core = { workspace = true }
forgeai-workflow-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeai_worker"]

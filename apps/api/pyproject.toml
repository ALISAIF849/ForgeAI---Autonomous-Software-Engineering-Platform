[project]
name = "forgeai-api"
version = "0.1.0"
description = "ForgeAI backend — FastAPI HTTP/WebSocket surface."
requires-python = ">=3.12"
dependencies = [
    "forgeai-core",
    "forgeai-workflow-engine",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "alembic>=1.14.0",
    "pyjwt>=2.9.0",
    "argon2-cffi>=23.1.0",
    "email-validator>=2.2.0",
]
# forgeai-workflow-engine: the new workflows module (2.7) is a thin HTTP surface
# over WorkflowExecutor — it orchestrates that class directly rather than
# reimplementing execution logic against the ORM models itself.

[tool.uv.sources]
forgeai-core = { workspace = true }
forgeai-workflow-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeai_api"]

[project]
name = "forgeai-memory-engine"
version = "0.1.0"
description = "Layer 5 — structured, episodic, and semantic project memory. See docs/architecture/05-memory-engine.md. No storage/recall implementation yet."
requires-python = ">=3.12"
dependencies = [
    "forgeai-core",
]

[tool.uv.sources]
forgeai-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeai_memory_engine"]

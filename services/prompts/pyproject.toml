[project]
name = "forgeai-prompts"
version = "0.1.0"
description = "Versioned prompt templates consumed by capability implementations, kept separate from capability logic so prompt wording changes are independently reviewable and diffable from behavior changes. See docs/engineering/01-repository-scaffolding.md §3 for why this exists as its own package. No templates yet."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeai_prompts"]

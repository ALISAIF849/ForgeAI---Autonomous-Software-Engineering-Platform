[project]
name = "forgeai-integrations"
version = "0.1.0"
description = "Scoped clients for GitHub, Railway, Vercel, and future third-party integrations. Credentials handled per docs/architecture/12-security-architecture.md §3 (envelope encryption, least-privilege per-project scoping). No clients implemented yet."
requires-python = ">=3.12"
dependencies = [
    "forgeai-core",
]

[tool.uv.sources]
forgeai-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeai_integrations"]

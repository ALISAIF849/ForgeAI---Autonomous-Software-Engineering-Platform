[project]
name = "forgeai-integrations"
version = "0.1.0"
description = "Scoped clients for GitHub, Railway, Vercel, and future third-party integrations. Credentials handled per docs/architecture/12-security-architecture.md §3 (envelope encryption, least-privilege per-project scoping)."
requires-python = ">=3.12"
dependencies = [
    "forgeai-core",
    "httpx>=0.27.0",
]
# httpx: GitHubProvider (sub-sprint 5.1) is a real REST client against
# api.github.com — not a fake/stubbed integration. Tests exercise it through
# httpx.MockTransport (a scripted HTTP layer, same "mock the boundary, not
# the logic" discipline as forgeai_model_router.provider.MockProvider), never
# through a hand-rolled fake that bypasses the actual request/response code.

[tool.uv.sources]
forgeai-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeai_integrations"]

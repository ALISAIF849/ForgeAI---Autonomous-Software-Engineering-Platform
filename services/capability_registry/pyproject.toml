[project]
name = "forgeai-capability-registry"
version = "0.1.0"
description = "Layer 3 — versioned, contract-first engineering capabilities. See docs/architecture/04-capability-registry.md."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "jsonschema>=4.23.0",
    "forgeai-core",
    "forgeai-model-router",
    "forgeai-prompts",
]
# jsonschema: the Executor (this sub-sprint) validates a capability's actual
# input/output against its declared input_schema/output_schema — a real JSON
# Schema validator, not the definition-time shape sanity check definition.py
# already does. forgeai-memory-engine is still not added: nothing here
# imports it yet (no Context Builder wiring memory into CapabilityContext
# yet) — same "don't declare speculatively" discipline as everywhere else in
# this repo, now satisfied for model-router/prompts since the code below
# actually imports them.

[tool.uv.sources]
forgeai-core = { workspace = true }
forgeai-model-router = { workspace = true }
forgeai-prompts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeai_capability_registry"]

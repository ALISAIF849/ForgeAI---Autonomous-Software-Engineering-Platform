[project]
name = "forgeai-capability-registry"
version = "0.1.0"
description = "Layer 3 — versioned, contract-first engineering capabilities. See docs/architecture/04-capability-registry.md."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "forgeai-core",
]
# forgeai-model-router / forgeai-memory-engine / forgeai-prompts are added back as
# sub-sprints 3.3-3.5 actually wire them in — not declared speculatively ahead of
# the code that imports them, same discipline as everywhere else in this repo.

[tool.uv.sources]
forgeai-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeai_capability_registry"]

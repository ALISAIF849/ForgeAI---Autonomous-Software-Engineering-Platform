[project]
name = "forgeai-capability-registry"
version = "0.1.0"
description = "Layer 3 — versioned, contract-first engineering capabilities. See docs/architecture/04-capability-registry.md."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "jsonschema>=4.23.0",
    "forgeai-core",
    "forgeai-model-router",
    "forgeai-prompts",
    "forgeai-workflow-engine",
]
# jsonschema: the Executor (sub-sprint 3.6) validates a capability's actual
# input/output against its declared input_schema/output_schema — a real JSON
# Schema validator, not the definition-time shape sanity check definition.py
# already does. forgeai-workflow-engine (this sub-sprint, 3.7): stage_runner.py
# adapts workflow_engine's StageRunner plug point to CapabilityExecutor — a
# one-directional dependency deliberately placed here rather than in
# workflow_engine itself, since workflow_engine's own principle (see its
# definition.py/runner.py docstrings) is that it must stay domain-agnostic
# with no AI/capability dependency; capability_registry depending on its
# plug-in ABC is the adapter relationship that respects that boundary.
# forgeai-memory-engine is still not added: nothing here imports it yet (no
# Context Builder wiring memory into CapabilityContext yet) — same "don't
# declare speculatively" discipline as everywhere else in this repo.

[tool.uv.sources]
forgeai-core = { workspace = true }
forgeai-model-router = { workspace = true }
forgeai-prompts = { workspace = true }
forgeai-workflow-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeai_capability_registry"]

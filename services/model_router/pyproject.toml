[project]
name = "forgeai-model-router"
version = "0.1.0"
description = "Layer 4 — routes capability calls to the right LLM, tracks cost/usage. See docs/architecture/06-model-router.md. No providers wired yet."
requires-python = ">=3.12"
dependencies = [
    "forgeai-core",
]

[tool.uv.sources]
forgeai-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeai_model_router"]
